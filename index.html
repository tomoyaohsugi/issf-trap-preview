<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0f1720"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Trap Preview"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><title>ISSF Trap Preview</title><style>
:root{--bg:#0f1720;--panel:#142231;--line:#425466;--orange:#ff681c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:100vw;height:100dvh;padding:max(3px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right)) max(3px,env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:3px}.head{height:32px;flex:0 0 32px;display:flex;justify-content:space-between;align-items:center}.title{font-size:14px;font-weight:900}.headBtns{display:flex;gap:3px}button,select{background:#24323c;color:#fff;border:1px solid var(--line);border-radius:7px;font-weight:800;touch-action:manipulation}.headBtns button{padding:5px 7px;font-size:11px}.stage{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;border:1px solid #33444f;background:#6fb6e6}.stage canvas{width:100%;height:100%;display:block}.info{position:absolute;left:7px;bottom:7px;background:#051014da;padding:5px 7px;border-radius:7px;font-size:10px;pointer-events:none}.hidden{display:none}.launch{height:34px;flex:0 0 34px;display:flex;justify-content:center}.launchBtn{width:min(54%,420px);height:32px;background:var(--orange);border-color:#ff984f;font-size:15px}.launchBtn:disabled{opacity:.55}.bottom{height:36px;flex:0 0 36px;display:grid;grid-template-columns:150px 135px 60px 1fr;gap:4px;align-items:center;background:var(--panel);border:1px solid #263740;border-radius:8px;padding:3px 5px}select{width:100%;height:28px;padding:2px 25px 2px 7px;font-size:11px}.progress{display:flex;justify-content:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;background:#596873}.dot.on{background:var(--orange);box-shadow:0 0 6px #ff681c}.next{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:right;font-size:11px;font-weight:800;color:#dce7ed}.rotate{display:none}@media(orientation:portrait){.rotate{display:flex;position:fixed;inset:0;z-index:999;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px;font-weight:800}.app{visibility:hidden}}@media(max-width:700px) and (orientation:landscape){.bottom{grid-template-columns:125px 115px 50px 1fr}.title{font-size:12px}.headBtns button{font-size:10px;padding:4px 6px}.next{font-size:10px}}
</style></head><body><div class="rotate">iPhoneを横向きにしてください</div><div class="app"><div class="head"><div class="title">Trap Preview</div><div class="headBtns"><button id="gridBtn">GRID 薄</button><button id="breakBtn">破壊 ON</button><button id="infoBtn">情報 ON</button></div></div><div class="stage"><canvas id="cv"></canvas><div id="info" class="info hidden"></div></div><div class="launch"><button id="launchBtn" class="launchBtn">TAP / 次へ</button></div><div class="bottom"><select id="setSelect"></select><select id="stationSelect"></select><div id="progress" class="progress"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div id="next" class="next"></div></div></div>
<script>
const SETS={1:[[30,2.5],[10,1.5],[-30,3],[40,1.7],[-5,2],[-45,2],[45,2],[-10,3],[-45,2.8],[45,2.3],[10,1.8],[-40,1.6],[30,2],[-5,1.5],[-35,3]],2:[[45,2.3],[10,1.5],[-20,2.8],[45,1.5],[0,2],[-45,2],[25,2],[0,3],[-45,1.5],[35,2.2],[10,2.4],[-40,1.5],[30,2.8],[-10,1.5],[-45,2]],3:[[45,2.5],[0,1.6],[-20,2],[35,2.9],[-5,1.8],[-45,3],[35,2.5],[-10,3],[-40,2.2],[40,2],[-5,2.5],[-30,3],[30,2],[0,1.8],[-30,3]],4:[[30,1.5],[0,3],[-20,2.2],[30,2],[-10,1.5],[-45,3],[25,3],[-5,1.5],[-15,1.8],[40,2.8],[-5,1.5],[-35,2.2],[15,3],[10,3],[-40,1.7]],5:[[20,1.8],[0,3],[-25,2.6],[35,3],[0,1.6],[-35,3],[35,2.3],[-5,1.8],[-35,1.6],[40,2.3],[0,2.3],[-40,3],[25,1.8],[-5,2.5],[-45,2]],6:[[45,1.9],[0,2.8],[-30,3],[40,1.5],[0,1.6],[-40,2],[35,2],[0,3],[-45,2],[45,2.3],[5,2],[-40,3],[25,2.4],[0,1.75],[-35,1.8]],7:[[40,3],[0,1.5],[-35,1.5],[45,2],[5,2.2],[-45,3],[40,1.5],[5,1.9],[-25,2.6],[20,1.8],[0,3],[-30,2.2],[35,2.5],[0,3],[-40,3]],8:[[40,3],[-5,3],[-15,2.2],[30,2],[-5,2],[-35,1.8],[40,2],[5,1.5],[-35,2.5],[45,1.5],[5,2],[-25,3],[15,1.5],[0,1.5],[-45,1.6]],9:[[30,1.6],[0,1.5],[-15,2],[20,2.4],[-5,3],[-35,2],[45,2],[-5,1.5],[-35,1.5],[45,1.6],[0,2.8],[-45,2],[25,3],[5,1.5],[-20,3]],10:[[45,2.25],[0,1.75],[-25,2],[35,1.8],[0,3],[-40,2.25],[40,3],[5,1.8],[-45,3],[45,2],[-10,2.5],[-35,1.5],[15,1.8],[10,2],[-45,1.5]]};
let setNo=1,station=1,shot=0,flying=false,showInfo=true,breakEnabled=true,gridMode=1,raf=null,dpr=1,bgReady=false;const bgImage=new Image();bgImage.src='./range-background.png';bgImage.onload=()=>{bgReady=true;draw()};const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),setSelect=document.getElementById('setSelect'),stationSelect=document.getElementById('stationSelect'),progress=document.getElementById('progress'),nextEl=document.getElementById('next'),info=document.getElementById('info'),launchBtn=document.getElementById('launchBtn'),breakBtn=document.getElementById('breakBtn'),infoBtn=document.getElementById('infoBtn'),gridBtn=document.getElementById('gridBtn');const at=a=>a>0?`右${a}°`:a<0?`左${Math.abs(a)}°`:'直進';
function resize(){cancelAnimationFrame(raf);raf=null;flying=false;launchBtn.disabled=false;const r=cv.getBoundingClientRect();dpr=devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function clearCanvas(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();ctx.setTransform(dpr,0,0,dpr,0,0)}
function drawCover(img,w,h){const ir=img.width/img.height,cr=w/h;let sw,sh,sx,sy;if(ir>cr){sh=img.height;sw=sh*cr;sx=(img.width-sw)/2;sy=0}else{sw=img.width;sh=sw/cr;sx=0;sy=(img.height-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h)}
function drawGrid(w,h){if(gridMode===0)return;const a=gridMode===1?.12:.24,m=gridMode===1?.22:.36;ctx.save();ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=1;for(const x of [w*.25,w*.75]){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(const y of [h*.25,h*.5,h*.75]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle=`rgba(255,255,255,${m})`;ctx.lineWidth=1.35;ctx.beginPath();ctx.moveTo(w*.5,0);ctx.lineTo(w*.5,h);ctx.stroke();ctx.restore()}
function bg(){clearCanvas();const w=cv.clientWidth,h=cv.clientHeight;if(bgReady)drawCover(bgImage,w,h);else{ctx.fillStyle='#71b9e6';ctx.fillRect(0,0,w,h)}drawGrid(w,h);return{w,h,oy:h*.845}}
function draw(){if(flying)return;const q=bg(),base=(station-1)*3+1;ctx.fillStyle='#0005';ctx.fillRect(0,0,q.w,26);ctx.fillStyle='#fff';ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillText(`${setNo}番セット・${station}番射台・次 放出機${base+shot}`,q.w/2,17)}
function updateUI(){setSelect.value=String(setNo);stationSelect.value=String(station);[...progress.children].forEach((d,i)=>d.classList.toggle('on',i===shot));const pool=SETS[setNo].slice((station-1)*3,station*3),base=(station-1)*3+1,[a,h]=pool[shot];nextEl.textContent=`次 ${base+shot}・${at(a)}・${h.toFixed(2)}m`;draw()}
function ballistics(height){const g=9.80665,R=76,x10=10,tanTheta=height/(x10*(1-x10/R)),theta=Math.atan(tanTheta),speed=Math.sqrt(g*R/Math.sin(2*theta)),flightTime=Math.sqrt(2*R*tanTheta/g);return{R,tanTheta,speed,flightTime}}
function particles(x,y,fx,scale){const p=[];for(let i=0;i<10;i++){const a=i/10*Math.PI*2+(i%3)*.17,mag=(18+(i*7)%28)*scale,size=(i<3?5:i<7?3.5:2.2)*scale;p.push({x,y,vx:fx*16*scale+Math.cos(a)*mag,vy:Math.sin(a)*mag-10*scale,size,rot:i*.61,vr:(i%2?1:-1)*(4+i*.28),color:i%4===0?'#ff9a55':'#ff5b18'})}return p}
function drawParts(parts,elapsed){const t=elapsed/1000,fade=Math.max(0,1-elapsed/300);for(const p of parts){const x=p.x+p.vx*t,y=p.y+p.vy*t+48*t*t,s=p.size*(.95-.35*Math.min(1,t/.3));ctx.save();ctx.translate(x,y);ctx.rotate(p.rot+p.vr*t);ctx.globalAlpha=fade;ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(-s,-s*.45);ctx.lineTo(s*.9,-s*.15);ctx.lineTo(s*.35,s*.65);ctx.lineTo(-s*.7,s*.4);ctx.closePath();ctx.fill();ctx.restore()}ctx.globalAlpha=1}
function launch(){if(flying)return;flying=true;launchBtn.disabled=true;const pool=SETS[setNo].slice((station-1)*3,station*3),current=shot,[angle,height]=pool[current],base=(station-1)*3+1,b=ballistics(height);info.textContent=`放出機 ${base+current}　${at(angle)}　高度 ${height.toFixed(2)}m　初速 ${b.speed.toFixed(1)}m/s　破壊 ${breakEnabled?'ON':'OFF'}`;if(showInfo)info.classList.remove('hidden');const q=bg(),w=q.w,h=q.h,start=performance.now(),dur=b.flightTime*1000,sx=w/2,sy=q.oy,ar=Math.sign(angle)*Math.pow(Math.abs(angle)/45,.72),ex=w/2+ar*w*.70,breakDistance=30,breakDuration=300;let brokenAt=null,parts=null;function finish(){raf=null;if(current===2){shot=0;station=station===5?1:station+1}else shot=current+1;flying=false;launchBtn.disabled=false;updateUI()}function frame(now){const u=Math.min(1,(now-start)/dur),range=b.R*u;bg();const rise=range*b.tanTheta*(1-range/b.R),x=sx+(ex-sx)*u,groundY=sy-u*h*.28,y=groundY-rise*h*.060,sc=Math.max(.22,1-.72*u);if(breakEnabled&&range>=breakDistance){if(brokenAt===null){brokenAt=now;parts=particles(x,y,Math.sign(ex-sx)||1,Math.max(.55,sc))}const e=now-brokenAt;drawParts(parts,e);if(e<breakDuration)raf=requestAnimationFrame(frame);else finish();return}ctx.save();ctx.translate(x,y);ctx.scale(sc,sc*.34);ctx.fillStyle='#ff5b18';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffe0bd';ctx.lineWidth=2;ctx.stroke();ctx.restore();if(u<1)raf=requestAnimationFrame(frame);else finish()}raf=requestAnimationFrame(frame)}
for(let i=1;i<=10;i++){const o=document.createElement('option');o.value=i;o.textContent=`SET ${i}`;setSelect.appendChild(o)}for(let i=1;i<=5;i++){const o=document.createElement('option');o.value=i;o.textContent=`射台 ${i}`;stationSelect.appendChild(o)}setSelect.onchange=()=>{if(flying)return;setNo=+setSelect.value;station=1;shot=0;updateUI()};stationSelect.onchange=()=>{if(flying)return;station=+stationSelect.value;shot=0;updateUI()};launchBtn.addEventListener('click',launch,{passive:true});breakBtn.onclick=()=>{breakEnabled=!breakEnabled;breakBtn.textContent='破壊 '+(breakEnabled?'ON':'OFF')};infoBtn.onclick=()=>{showInfo=!showInfo;infoBtn.textContent='情報 '+(showInfo?'ON':'OFF');if(!showInfo)info.classList.add('hidden')};gridBtn.onclick=()=>{gridMode=(gridMode+1)%3;gridBtn.textContent=gridMode===0?'GRID OFF':gridMode===1?'GRID 薄':'GRID 濃';draw()};let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,120)});addEventListener('orientationchange',()=>setTimeout(resize,250));requestAnimationFrame(()=>{resize();updateUI()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
